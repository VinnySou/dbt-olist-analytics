version: 2

snapshots:
  - name: snp_olist__order_status
    description: >
      Histórico de order_status por pedido (SCD tipo 2), direto de `raw_orders`
      (antes da staging, como é convenção em snapshots). Usa strategy `check` sobre
      a coluna `order_status`: a cada `dbt snapshot`/`dbt build`, se o status de um
      pedido mudou desde a última captura, a versão anterior é fechada
      (`dbt_valid_to` preenchido) e uma nova versão é inserida com `dbt_valid_from`
      da execução atual. Como os seeds sintéticos são estáticos, rodar localmente
      sem alterar `raw_orders.csv` entre execuções não cria novas versões - isso é
      esperado, o objetivo aqui é demonstrar a técnica de SCD tipo 2, não simular
      mudanças reais de status pós-compra.
    columns:
      - name: order_id
        description: Pedido rastreado pelo snapshot.
        tests:
          - not_null
      - name: customer_id
        description: Cliente que fez o pedido, carregado junto por conveniência (não é o atributo rastreado).
        tests:
          - not_null
      - name: order_status
        description: Status do pedido no momento desta versão (atributo rastreado pela strategy `check`).
        tests:
          - not_null
      - name: dbt_valid_from
        description: Timestamp em que esta versão passou a ser válida.
        tests:
          - not_null
      - name: dbt_valid_to
        description: Timestamp em que esta versão deixou de ser válida. Nulo = versão atual do pedido.
      - name: dbt_scd_id
        description: Chave surrogate gerada pelo dbt, única por versão (linha) do snapshot.
        tests:
          - unique
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - dbt_valid_from
