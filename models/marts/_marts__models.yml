version: 2

models:
  - name: dim_customers
    description: Uma linha por customer_id (chave por pedido, ver customer_unique_id para o cliente real ao longo do tempo). Dimensão direta da staging, sem lógica adicional.
    columns:
      - name: customer_id
        description: Chave primária da dimensão.
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Identificador estável do cliente ao longo de múltiplos pedidos.
        tests:
          - not_null

  - name: dim_sellers
    description: Uma linha por vendedor. Dimensão direta da staging, sem lógica adicional.
    columns:
      - name: seller_id
        description: Chave primária da dimensão.
        tests:
          - unique
          - not_null

  - name: dim_products
    description: Uma linha por produto, com a categoria já traduzida (herdada da staging) e uma classificação de porte calculada a partir do volume da embalagem.
    columns:
      - name: product_id
        description: Chave primária da dimensão.
        tests:
          - unique
          - not_null
      - name: category
        description: Categoria do produto traduzida para inglês (fallback para o nome original ou 'unknown').
        tests:
          - not_null
      - name: product_volume_cm3
        description: Volume da embalagem em cm³ (comprimento × altura × largura). Nulo quando alguma dimensão está ausente na origem.
      - name: product_size_category
        description: Porte do produto por volume da embalagem - 'pequeno' (< 30.000 cm³), 'medio' (< 100.000 cm³), 'grande' (>= 100.000 cm³) ou 'unknown' quando o volume não pôde ser calculado.
        tests:
          - accepted_values:
              arguments:
                values: ['pequeno', 'medio', 'grande', 'unknown']

  - name: fct_order_items
    description: Uma linha por item de pedido (grão de `stg_olist__order_items`). Liga produto, vendedor e a data de compra do pedido às métricas de preço e frete do item.
    columns:
      - name: order_id
        description: Pedido ao qual o item pertence.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: order_item_id
        description: Número sequencial do item dentro do pedido (junto com order_id, forma a chave primária do grão).
        tests:
          - not_null
      - name: product_id
        description: Produto vendido neste item.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: Vendedor responsável por este item.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: order_purchase_date_key
        description: Data de compra do pedido no formato YYYYMMDD, FK para `dim_date.date_key`.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: price
        description: Preço do item, sem frete.
        tests:
          - not_null
      - name: freight_value
        description: Valor do frete alocado a este item.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

  - name: dim_date
    description: Calendário gerado com `dbt_utils.date_spine`, uma linha por dia entre `var('dim_date_start_date')` e `var('dim_date_end_date')` (definidos em `dbt_project.yml`, cobrindo o período dos pedidos sintéticos com folga).
    columns:
      - name: date_day
        description: Chave primária da dimensão (data, grão diário).
        tests:
          - unique
          - not_null
      - name: date_key
        description: Data no formato inteiro YYYYMMDD, útil como chave substituta em fatos.
        tests:
          - unique
          - not_null
      - name: year
        description: Ano da data.
      - name: quarter
        description: Trimestre do ano (1 a 4).
      - name: month
        description: Mês do ano (1 a 12).
      - name: day_of_month
        description: Dia do mês (1 a 31).
      - name: day_of_week
        description: Dia da semana (0 = domingo a 6 = sábado, convenção do DuckDB `extract(dow from ...)`).
      - name: day_name
        description: Nome do dia da semana por extenso.
      - name: month_name
        description: Nome do mês por extenso.
      - name: is_weekend
        description: Booleano indicando se a data cai em sábado ou domingo.
