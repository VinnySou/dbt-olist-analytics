version: 2

snapshots:
  - name: snap_orders_status
    description: >
      Histórico (SCD tipo 2) de order_status por pedido. Estratégia `check` em
      order_status: toda vez que o snapshot roda e o status de um order_id
      mudou desde a última execução, a linha antiga é fechada (dbt_valid_to
      preenchido) e uma nova linha é aberta com o status atual. Como os dados
      de origem são sintéticos e estáticos, a primeira execução abre uma linha
      por pedido com dbt_valid_to nulo; o histórico só cresce se order_status
      mudar entre execuções do dbt.
    columns:
      - name: order_id
        description: Chave natural do pedido (não é única na tabela de snapshot; repete uma vez por mudança de status registrada).
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled']
      - name: dbt_valid_from
        description: Timestamp em que esta versão do registro passou a ser válida (preenchido pelo dbt).
        tests:
          - not_null
      - name: dbt_valid_to
        description: Timestamp em que esta versão deixou de ser válida; nulo significa que é a versão atual do pedido.
      - name: dbt_scd_id
        description: Chave surrogate única gerada pelo dbt para cada versão do registro.
        tests:
          - unique
          - not_null
