version: 2

seeds:
  - name: raw_customers
    description: Clientes do marketplace (amostra sintética; schema igual ao dataset real da Olist).
    tests:
      - min_row_count:
          arguments:
            min_count: 40
  - name: raw_sellers
    description: Vendedores do marketplace.
    tests:
      - min_row_count:
          arguments:
            min_count: 10
  - name: raw_products
    description: Catálogo de produtos.
    tests:
      - min_row_count:
          arguments:
            min_count: 20
  - name: raw_category_translation
    description: Tradução de categoria de produto (PT -> EN).
    tests:
      - min_row_count:
          arguments:
            min_count: 5
  - name: raw_orders
    description: Pedidos, com datas de compra/aprovação/entrega.
    tests:
      - min_row_count:
          arguments:
            min_count: 60
  - name: raw_order_items
    description: Itens de cada pedido (grão de item).
    tests:
      - min_row_count:
          # Cada pedido gera de 1 a 2 itens (scripts/generate_seed_data.py), então o
          # piso teórico é um item por pedido, não a contagem atual (que varia com o RNG).
          arguments:
            min_count: 60
  - name: raw_payments
    description: Pagamentos de cada pedido.
    tests:
      - min_row_count:
          arguments:
            min_count: 60
  - name: raw_reviews
    description: Avaliação de cada pedido.
    tests:
      - min_row_count:
          arguments:
            min_count: 60
