version: 2

snapshots:
  - name: snapshot_order_status
    description: >
      Histórico de mudança de `order_status` (SCD tipo 2) a partir de `stg_olist__orders`.
      Estratégia `check` no `order_status`: cada vez que o status de um pedido muda, a linha
      antiga é fechada (`dbt_valid_to` preenchido) e uma nova linha é aberta (`dbt_valid_from`),
      preservando o histórico. Rodar com `dbt snapshot` (ou `dbt build`, que já inclui os
      snapshots no DAG).
    columns:
      - name: order_id
        description: Pedido cujo status está sendo rastreado ao longo do tempo.
        tests:
          - not_null
      - name: order_status
        description: Status do pedido no momento desta versão da linha.
        tests:
          - not_null
      - name: dbt_scd_id
        description: Chave primária da versão (gerada pelo dbt a partir de `unique_key` + timestamp de mudança).
        tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: Timestamp a partir do qual esta versão da linha passou a ser válida.
        tests:
          - not_null
      - name: dbt_valid_to
        description: Timestamp em que esta versão deixou de ser válida (nulo = versão atual do pedido).
